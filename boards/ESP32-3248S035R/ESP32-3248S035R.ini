[env:esp32-3248s035r]
extends = CYD_base
board = esp32dev

build_unflags =
	-DILI9341_2_DRIVER
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_DC=27
	-DROTATION=1
	-DDEVICE_NAME='"CYD-2432S028"'

build_flags =
	${CYD_base.build_flags}
	-DST7796_DRIVER=1
	-DTFT_WIDTH=480
	-DTFT_HEIGHT=320
	-DROTATION=3
	-DTFT_DC=2
	-DDEVICE_NAME='"ESP32-3248S035R"'

	; Display (ST7796)
	-DTFT_SCLK=14
	-DTFT_MOSI=13
	-DTFT_MISO=12
	-DTFT_CS=15
	-DTFT_RST=-1 ; Disabled to avoid conflict with TOUCH_CS
	-DTFT_BL=32

	; Touch (XPT2046)
	-DUSE_TFT_eSPI_TOUCH
	-DTOUCH_DRIVER=2046
	-DTOUCH_CS=33
	-DTOUCH_IRQ=36
	-DAXIS_REVERSED

	; MicroSD
	-DSDCARD_CS=5
	-DSDCARD_SCK=18
	-DSDCARD_MOSI=23
	-DSDCARD_MISO=19

	; Buzzer
	-DBUZZ_PIN=0

	-DTFT_INVERSION_ON
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000
